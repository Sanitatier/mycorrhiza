<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mycorrhiza.ru</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #0a0705; overflow: hidden;
    font-family: 'Courier New', ui-monospace, monospace;
  }
  canvas { position: absolute; top: 0; left: 0; display: block; }
  #bg      { z-index: 1; }
  #growth  { z-index: 2; }
  #fg      { z-index: 3; }
  #overlay {
    position: fixed; left: 28px; bottom: 24px; z-index: 10;
    color: rgba(220, 210, 190, 0.55);
    letter-spacing: 0.12em;
    text-shadow: 0 0 12px rgba(0,0,0,0.8);
    user-select: none; pointer-events: none;
    opacity: 0; transition: opacity 2.5s ease;
  }
  #overlay .domain { font-size: 15px; font-weight: bold; color: rgba(230, 224, 200, 0.75); }
  #overlay .tag { font-size: 11px; margin-top: 4px; opacity: 0.7; }
  #vignette {
    position: fixed; inset: 0; z-index: 4; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%);
  }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="growth"></canvas>
<canvas id="fg"></canvas>
<div id="vignette"></div>
<div id="overlay">
  <div class="domain">mycorrhiza.ru</div>
  <div class="tag">симбиоз в процессе роста</div>
</div>

<script>
(function(){
  "use strict";

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const bg = document.getElementById('bg');
  const growth = document.getElementById('growth');
  const fg = document.getElementById('fg');
  const bctx = bg.getContext('2d');
  const gctx = growth.getContext('2d');
  const fctx = fg.getContext('2d');

  let W, H, DPR;

  function rand(a,b){ return a + Math.random()*(b-a); }
  function chance(p){ return Math.random() < p; }
  function angDiff(a,b){ let d = (b-a) % (Math.PI*2); if(d>Math.PI) d-=Math.PI*2; if(d<-Math.PI) d+=Math.PI*2; return d; }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---------- palettes ----------
  const GRANULE_COLORS = ['#2a1c12','#3b2818','#241a10','#4a3220','#1a120b','#2f2013'];
  const PEBBLE_COLORS  = ['#5c5c58','#6e6a62','#4a4844','#767068'];
  const ROOT_PALETTE   = ['#a97a3d','#c9a227','#e8e2d0','#7a9b57','#8b5a2b'];
  const GLOW_COLOR     = '#f2d675';
  const SPECIES = {
    blue: { hypha: '#7fb3cf', core: '#bcd9e6' },
    pink: { hypha: '#cf82ac', core: '#ecc0dc' }
  };
  const DEATH_THRESHOLD = 6; // connected-plant deaths (or equivalent grazing damage) that kill a fungal body

  // per-order root parameters. Root growth speed is intentionally well below hyphae growth speed.
  const ROOT_ORDER = [
    { wStart:2.6, wMax:8.0,  sec:0.0020, tipFrac:0.5,  life:[2600,3800], branchIv:[45,90],  jitter:0.045, gravity:0.020, canBranch:true,  speed:[0.10,0.16] },
    { wStart:1.2, wMax:3.6,  sec:0.0009, tipFrac:0.45, life:[1200,2000], branchIv:[55,110], jitter:0.06,  gravity:0.009, canBranch:true,  speed:[0.08,0.13] },
    { wStart:0.55,wMax:1.6,  sec:0.0003, tipFrac:0.4,  life:[500,1000],  branchIv:[9999,9999],jitter:0.08,gravity:0.004, canBranch:false, speed:[0.06,0.10] }
  ];

  function plantCap(){ return Math.round(clamp(W*H/130000, 5, 15)); }
  function colonyCap(){ return Math.round(clamp(W*H/140000, 5, 15)); }

  // ---------- state ----------
  let branches = [];      // root system (order 0/1/2), tree via flat list
  let hyphae = [];        // fungal hyphae tips
  let fungalBodies = [];  // mycelium colonies
  let creatures = [];
  let pulses = [];
  let frame = 0;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    [bg, growth, fg].forEach(c => {
      c.width = W*DPR; c.height = H*DPR;
      c.style.width = W+'px'; c.style.height = H+'px';
    });
    bctx.setTransform(DPR,0,0,DPR,0,0);
    gctx.setTransform(DPR,0,0,DPR,0,0);
    fctx.setTransform(DPR,0,0,DPR,0,0);
    drawSoil();
    gctx.clearRect(0,0,W,H);
    branches = []; hyphae = []; fungalBodies = []; pulses = [];
    seedWorld();
  }

  // ---------- soil background ----------
  function drawSoil(){
    const g = bctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0, '#1b120c');
    g.addColorStop(1, '#0a0705');
    bctx.fillStyle = g;
    bctx.fillRect(0,0,W,H);

    for(let i=0;i<Math.floor(W*H/1800);i++){
      bctx.fillStyle = GRANULE_COLORS[Math.floor(rand(0,GRANULE_COLORS.length))];
      bctx.globalAlpha = rand(0.3,0.8);
      const x = rand(0,W), y = rand(0,H), r = rand(0.6,2.4);
      bctx.beginPath(); bctx.ellipse(x,y,r,r*rand(0.7,1.2),rand(0,6.28),0,6.28); bctx.fill();
    }
    bctx.globalAlpha = 1;

    for(let i=0;i<Math.floor(W*H/45000);i++){
      const x = rand(0,W), y = rand(0,H), r = rand(3,9);
      bctx.fillStyle = PEBBLE_COLORS[Math.floor(rand(0,PEBBLE_COLORS.length))];
      bctx.beginPath(); bctx.ellipse(x,y,r,r*rand(0.7,1),rand(0,6.28),0,6.28); bctx.fill();
      bctx.fillStyle = 'rgba(255,255,255,0.06)';
      bctx.beginPath(); bctx.ellipse(x-r*0.3,y-r*0.3,r*0.35,r*0.25,0,0,6.28); bctx.fill();
    }

    bctx.strokeStyle = 'rgba(90,68,44,0.18)';
    for(let i=0;i<Math.floor(W*H/90000);i++){
      let x = rand(0,W), y = rand(0,H);
      bctx.beginPath(); bctx.moveTo(x,y);
      const segs = Math.floor(rand(3,7));
      for(let s=0;s<segs;s++){ x += rand(-40,40); y += rand(-25,25); bctx.lineTo(x,y); }
      bctx.lineWidth = rand(0.5,1.2);
      bctx.stroke();
    }

    for(let i=0;i<Math.floor(W*H/9000);i++){
      bctx.fillStyle = 'rgba(150,125,90,0.05)';
      const x = rand(0,W), y = rand(0,H);
      bctx.beginPath(); bctx.arc(x,y,rand(0.5,1.4),0,6.28); bctx.fill();
    }
  }

  // place a soil-matching granule dot (used for decay/dissolve of roots and dead mycelium)
  function soilDot(x,y,r){
    gctx.fillStyle = GRANULE_COLORS[Math.floor(rand(0,GRANULE_COLORS.length))];
    gctx.globalAlpha = rand(0.55,0.95);
    gctx.beginPath(); gctx.ellipse(x+rand(-1.5,1.5), y+rand(-1.5,1.5), r*rand(0.7,1.1), r*rand(0.6,1), rand(0,6.28), 0, 6.28);
    gctx.fill();
    gctx.globalAlpha = 1;
  }

  // ---------- root branches ----------
  function makeBranch(order, x, y, angle, color, parentWidth, plantId){
    const cfg = ROOT_ORDER[order];
    return {
      order, x, y, angle, color,
      plantId: order===0 ? null : plantId,          // set to self below for order 0
      associatedBodies: order===0 ? new Set() : null, // fungal bodies connected anywhere on this plant
      connectedBody: null,
      speed: rand(cfg.speed[0], cfg.speed[1]),
      baseWidth: parentWidth ? parentWidth*0.42 : cfg.wStart,
      widthMax: cfg.wMax,
      tipFrac: cfg.tipFrac,
      path: [{x,y}],
      distSinceSample: 0,
      branchAccum: 0,
      branchInterval: rand(cfg.branchIv[0], cfg.branchIv[1]),
      maxLife: rand(cfg.life[0], cfg.life[1]),
      age: 0,
      state: 'growing',   // growing -> mature -> decaying -> gone
      matureTimer: 0,
      matureDuration: rand(500,1100),
      decayIndex: 0,
      decayDots: 1,
      connected: false,
      connectedSpecies: null
    };
  }

  function plantCount(){
    return branches.reduce((n,b)=> n + (b.order===0 && b.state!=='gone' ? 1:0), 0);
  }

  function spawnRoot(x){
    if(plantCount() >= plantCap()) return;
    const color = ROOT_PALETTE[Math.floor(rand(0,ROOT_PALETTE.length))];
    const b = makeBranch(0, x, -4, Math.PI/2 + rand(-0.15,0.15), color, null, null);
    b.plantId = b; // a plant's identity is its main taproot object
    branches.push(b);
  }

  function spawnChildBranch(parent){
    if(branches.length > 900) return;
    const order = parent.order + 1;
    if(order > 2) return;
    const sign = chance(0.5) ? 1 : -1;
    const spread = order===1 ? rand(0.65,1.2) : rand(0.4,0.85);
    const b = makeBranch(order, parent.x, parent.y, parent.angle + sign*spread, parent.color, parent.baseWidth, parent.plantId);
    branches.push(b);
  }

  function thickenRedraw(b){
    const n = b.path.length;
    if(n < 2) return;
    gctx.lineCap = 'round';
    gctx.strokeStyle = b.color;
    gctx.globalAlpha = 0.92;
    for(let i=1;i<n;i++){
      const t = i/n;
      const w = b.baseWidth * (1 - t*(1-b.tipFrac));
      gctx.lineWidth = Math.max(0.4, w);
      gctx.beginPath();
      gctx.moveTo(b.path[i-1].x, b.path[i-1].y);
      gctx.lineTo(b.path[i].x, b.path[i].y);
      gctx.stroke();
    }
    gctx.globalAlpha = 1;
  }

  // detach a dying branch from whatever fungal body it was feeding, killing the hyphae that fed on it
  function severBranchFromFungus(b){
    if(b.connected && b.connectedBody){
      const body = b.connectedBody;
      body.connectedBranches.delete(b);
      for(const h of hyphae) if(h.connectedBranch === b) h.alive = false;
      b.connected = false; b.connectedBody = null; b.connectedSpecies = null;
    }
    if(b.order === 0 && b.associatedBodies){
      for(const body of b.associatedBodies){
        if(body.state === 'alive' && !body.deadPlantIds.has(b)){
          body.deadPlantIds.add(b);
          body.penaltyCount++;
          checkBodyDeath(body);
        }
      }
    }
  }

  function updateBranch(b){
    b.age++;
    if(b.state === 'growing'){
      const cfg = ROOT_ORDER[b.order];
      b.angle += rand(-cfg.jitter, cfg.jitter);
      b.angle += (Math.PI/2 - b.angle) * cfg.gravity * 0.15 + cfg.gravity*0.01;
      const px = b.x, py = b.y;
      b.x += Math.cos(b.angle)*b.speed;
      b.y += Math.sin(b.angle)*b.speed;

      gctx.strokeStyle = b.color;
      gctx.globalAlpha = 0.9;
      gctx.lineCap = 'round';
      gctx.lineWidth = Math.max(0.4, b.baseWidth*b.tipFrac);
      gctx.beginPath(); gctx.moveTo(px,py); gctx.lineTo(b.x,b.y); gctx.stroke();
      gctx.globalAlpha = 1;

      b.distSinceSample += b.speed;
      if(b.distSinceSample > 3){ b.path.push({x:b.x,y:b.y}); b.distSinceSample = 0; }

      b.baseWidth = Math.min(b.widthMax, b.baseWidth + cfg.sec);

      if(cfg.canBranch){
        b.branchAccum += b.speed;
        if(b.branchAccum > b.branchInterval){
          b.branchAccum = 0;
          b.branchInterval = rand(cfg.branchIv[0], cfg.branchIv[1]);
          spawnChildBranch(b);
        }
      }

      if(frame % 40 === 0) thickenRedraw(b);

      if(b.age > b.maxLife || b.y > H+10 || b.x < -30 || b.x > W+30 || b.baseWidth < 0.3){
        b.path.push({x:b.x,y:b.y});
        thickenRedraw(b);
        b.state = 'mature';
      }
    } else if(b.state === 'mature'){
      b.matureTimer++;
      if(b.matureTimer > b.matureDuration){
        b.state = 'decaying';
        severBranchFromFungus(b);
        const dur = clamp(b.path.length*rand(1.6,2.6), 60, 500);
        b.decayDots = Math.max(1, Math.ceil(b.path.length/dur));
      }
    } else if(b.state === 'decaying'){
      for(let k=0;k<b.decayDots && b.decayIndex < b.path.length;k++){
        const p = b.path[b.decayIndex];
        const t = b.decayIndex/b.path.length;
        const r = b.baseWidth*(1-t*(1-b.tipFrac))*0.85 + 1;
        soilDot(p.x, p.y, r);
        b.decayIndex++;
      }
      if(b.decayIndex >= b.path.length) b.state = 'gone';
    }
  }

  // ---------- fungal bodies & hyphae ----------
  function newFungalBody(x,y,species){
    const pal = SPECIES[species];
    const body = {
      x, y, species,
      baseR: rand(6,11), r: 0,
      connectedBranches: new Set(),
      penaltyCount: 0,
      deadPlantIds: new Set(),
      state: 'alive'
    };
    body.r = body.baseR;
    const grad = gctx.createRadialGradient(x,y,0,x,y,body.r);
    grad.addColorStop(0, pal.core);
    grad.addColorStop(1, 'rgba(80,120,140,0.05)');
    gctx.fillStyle = grad;
    gctx.beginPath(); gctx.arc(x,y,body.r,0,6.28); gctx.fill();
    fungalBodies.push(body);

    const n = Math.floor(rand(2,4));
    for(let i=0;i<n;i++){
      hyphae.push({
        species, color: pal.hypha, colony: body,
        x, y, angle: rand(0,6.28), curve: rand(-0.015,0.015),
        speed: rand(0.26,0.42), width: rand(0.8,1.4),
        alive:true, life:0, connected:false, seeking:true, connectedBranch:null
      });
    }
    return body;
  }

  function spawnFungus(){
    if(fungalBodies.length >= colonyCap()) return;
    const blues = fungalBodies.filter(f=>f.species==='blue').length;
    const pinks = fungalBodies.filter(f=>f.species==='pink').length;
    const species = blues <= pinks ? 'blue' : 'pink';
    newFungalBody(rand(W*0.05,W*0.95), rand(H*0.35,H*0.94), species);
  }

  // colony grows visually as more roots feed it
  function growBody(body){
    const target = clamp(body.baseR + body.connectedBranches.size*2.3, body.baseR, body.baseR+32);
    if(target > body.r + 0.4){
      body.r = target;
      const pal = SPECIES[body.species];
      const grad = gctx.createRadialGradient(body.x,body.y,0,body.x,body.y,body.r);
      grad.addColorStop(0, pal.core);
      grad.addColorStop(1, 'rgba(80,120,140,0.05)');
      gctx.fillStyle = grad;
      gctx.beginPath(); gctx.arc(body.x,body.y,body.r,0,6.28); gctx.fill();
    }
  }

  // a fungal body dies once enough connected plants have died (or it's been grazed down hard enough);
  // all its hyphae vanish except one short strand, which leads to a fresh body of the same species
  function checkBodyDeath(body){
    if(body.state !== 'alive' || body.penaltyCount < DEATH_THRESHOLD) return;
    body.state = 'gone';

    for(let i=0;i<26;i++){
      const a = rand(0,6.28), d = rand(0,body.r);
      soilDot(body.x+Math.cos(a)*d, body.y+Math.sin(a)*d, rand(1.5,3));
    }
    for(const h of hyphae) if(h.colony === body) h.alive = false;
    for(const br of body.connectedBranches){ br.connected=false; br.connectedBody=null; br.connectedSpecies=null; }

    const angle = rand(0,6.28), len = rand(20,38);
    const nx = clamp(body.x+Math.cos(angle)*len, 12, W-12);
    const ny = clamp(body.y+Math.sin(angle)*len, H*0.3, H-12);
    const pal = SPECIES[body.species];
    gctx.strokeStyle = pal.hypha; gctx.globalAlpha = 0.6; gctx.lineWidth = 1.1; gctx.lineCap='round';
    gctx.beginPath(); gctx.moveTo(body.x,body.y); gctx.lineTo(nx,ny); gctx.stroke(); gctx.globalAlpha = 1;

    fungalBodies = fungalBodies.filter(f => f !== body);
    newFungalBody(nx, ny, body.species);
  }

  function nearestRootTip(x,y,maxDist,species){
    let best=null, bestD=maxDist;
    for(const b of branches){
      if(b.state==='decaying' || b.state==='gone') continue;
      if(b.connected && b.connectedSpecies !== species) continue; // claimed by rival fungus
      const d = Math.hypot(b.x-x,b.y-y);
      if(d<bestD){ bestD=d; best=b; }
    }
    return best;
  }

  function fungalCombat(h){
    for(const other of hyphae){
      if(other===h || !other.alive || other.species===h.species) continue;
      if(Math.hypot(other.x-h.x, other.y-h.y) < 6){
        const loser = h.width <= other.width ? h : other;
        if(chance(0.05)) loser.alive = false;
      }
    }
  }

  function updateHypha(h){
    h.life++;
    if(h.seeking && !h.connected){
      const target = nearestRootTip(h.x,h.y,200,h.species);
      if(target){
        const ta = Math.atan2(target.y-h.y, target.x-h.x);
        h.angle += angDiff(h.angle, ta)*0.06;
        if(Math.hypot(target.x-h.x, target.y-h.y) < 9){
          h.connected = true; h.seeking = false; h.connectedBranch = target;
          target.connected = true; target.connectedSpecies = h.species; target.connectedBody = h.colony;
          h.colony.connectedBranches.add(target);
          if(target.plantId && target.plantId.associatedBodies) target.plantId.associatedBodies.add(h.colony);
          growBody(h.colony);
          if(target.state==='growing') target.speed *= 1.4;
          h.speed *= 1.4; h.width *= 1.3;
          const mx=(h.x+target.x)/2, my=(h.y+target.y)/2;
          const grad = gctx.createRadialGradient(mx,my,0,mx,my,10);
          grad.addColorStop(0, GLOW_COLOR); grad.addColorStop(1,'rgba(242,214,117,0)');
          gctx.fillStyle = grad; gctx.beginPath(); gctx.arc(mx,my,10,0,6.28); gctx.fill();
          pulses.push({x:mx,y:my,born:frame});
        }
      }
    } else {
      h.angle += rand(-0.09,0.09);
    }
    // gentle persistent curvature so hyphae wander in soft arcs, never as straight rays
    h.curve += rand(-0.004,0.004);
    h.curve = clamp(h.curve,-0.05,0.05);
    h.angle += h.curve;

    fungalCombat(h);
    if(!h.alive) return;
    const px=h.x, py=h.y;
    h.x += Math.cos(h.angle)*h.speed;
    h.y += Math.sin(h.angle)*h.speed;
    gctx.strokeStyle = h.color; gctx.globalAlpha=0.5; gctx.lineWidth=h.width; gctx.lineCap='round';
    gctx.beginPath(); gctx.moveTo(px,py); gctx.lineTo(h.x,h.y); gctx.stroke(); gctx.globalAlpha=1;

    if(hyphae.length<200 && chance(0.003) && h.width>0.5){
      hyphae.push({species:h.species, color:h.color, colony:h.colony, x:h.x,y:h.y,
        angle:h.angle+rand(-0.5,0.5), curve:rand(-0.015,0.015), speed:h.speed*rand(0.7,0.9),
        width:h.width*0.6, alive:true, life:0, connected:false, seeking:true, connectedBranch:null});
      h.width*=0.92;
    }
    if(h.x<-20||h.x>W+20||h.y>H+20||h.life>2200||h.width<0.3) h.alive=false;
  }

  // ---------- creatures ----------
  function spawnCreature(){
    if(creatures.length > 6) return;
    const type = chance(0.5) ? 'worm' : 'bug';
    creatures.push({
      type, x: rand(0,W), y: rand(H*0.15,H*0.95),
      angle: rand(0,6.28), phase: rand(0,6.28),
      history: [], baseSpeed: type==='worm' ? rand(0.22,0.34) : rand(0.5,0.8),
      pauseTimer: 0, moveTimer: Math.floor(rand(20,60)), paused:false
    });
  }

  function updateWorm(c){
    c.angle += Math.sin(frame*0.02 + c.phase)*0.02 + rand(-0.008,0.008);
    const speed = c.baseSpeed * (0.55 + 0.45*Math.sin(frame*0.05 + c.phase));
    const margin = 40;
    if(c.x < margin) c.angle += (Math.PI/2 - Math.abs(angDiff(c.angle,0)))*0.01 + 0.01;
    if(c.x > W-margin) c.angle -= 0.01;
    if(c.y < H*0.12+margin) c.angle += 0.01;
    if(c.y > H-margin) c.angle -= 0.01;

    c.x += Math.cos(c.angle)*speed;
    c.y += Math.sin(c.angle)*speed;
    c.x = clamp(c.x, 0, W); c.y = clamp(c.y, H*0.1, H);

    c.history.unshift({x:c.x,y:c.y});
    if(c.history.length > 26) c.history.length = 26;

    fctx.lineCap = 'round';
    const segCount = 7, step = 3;
    for(let i=0;i<segCount-1;i++){
      const p1 = c.history[i*step], p2 = c.history[(i+1)*step];
      if(!p1||!p2) break;
      const r = 2.6 * (1 - i/segCount) + 0.6;
      fctx.lineWidth = r*2;
      fctx.strokeStyle = i%2===0 ? '#c98b6b' : '#b87856';
      fctx.beginPath(); fctx.moveTo(p1.x,p1.y); fctx.lineTo(p2.x,p2.y); fctx.stroke();
    }
    biteNearby(c);
  }

  function updateBug(c){
    if(c.paused){
      c.pauseTimer--;
      if(c.pauseTimer<=0){ c.paused=false; c.moveTimer=Math.floor(rand(10,26)); c.angle += rand(-1.4,1.4); }
    } else {
      c.moveTimer--;
      const speed = c.baseSpeed;
      c.x += Math.cos(c.angle)*speed;
      c.y += Math.sin(c.angle)*speed;
      if(c.x<0||c.x>W) c.angle = Math.PI - c.angle;
      if(c.y<H*0.1||c.y>H) c.angle = -c.angle;
      c.x = clamp(c.x,0,W); c.y = clamp(c.y,H*0.1,H);
      if(c.moveTimer<=0){ c.paused=true; c.pauseTimer=Math.floor(rand(15,50)); }
    }
    fctx.save();
    fctx.translate(c.x,c.y); fctx.rotate(c.angle);
    fctx.fillStyle = '#3a2418';
    fctx.beginPath(); fctx.ellipse(0,0,5,3,0,0,6.28); fctx.fill();
    fctx.strokeStyle = '#3a2418'; fctx.lineWidth = 1;
    for(let i=-1;i<=1;i++){ fctx.beginPath(); fctx.moveTo(i*2,2); fctx.lineTo(i*2+1.5,6); fctx.stroke(); }
    fctx.restore();
    biteNearby(c);
  }

  function biteMark(x,y){
    gctx.fillStyle = 'rgba(10,7,5,0.85)';
    gctx.beginPath(); gctx.arc(x,y,2.6,0,6.28); gctx.fill();
  }

  function biteNearby(c){
    for(const b of branches){
      if(b.state!=='growing') continue;
      if(Math.hypot(b.x-c.x,b.y-c.y) < 9 && chance(0.01)){
        b.state='mature'; b.matureTimer=b.matureDuration+1; // push straight past maturity into decay soon
        biteMark(b.x,b.y);
      }
    }
    for(const h of hyphae){
      if(!h.alive) continue;
      if(Math.hypot(h.x-c.x,h.y-c.y) < 8 && chance(0.09)){
        h.alive=false; biteMark(h.x,h.y);
      }
    }
    // bugs and worms also graze directly on the mycelium body itself, which slowly
    // undermines the colony's vitality and balances its growth off the roots' resources
    for(const body of fungalBodies){
      if(body.state!=='alive') continue;
      if(Math.hypot(body.x-c.x,body.y-c.y) < body.r+6 && chance(0.012)){
        body.penaltyCount++;
        const a = rand(0,6.28);
        soilDot(body.x+Math.cos(a)*body.r*rand(0.5,0.95), body.y+Math.sin(a)*body.r*rand(0.5,0.95), rand(1,2));
        checkBodyDeath(body);
      }
    }
  }

  function seedWorld(){
    for(let i=0;i<plantCap();i++) spawnRoot(rand(W*0.06,W*0.94));
    for(let i=0;i<colonyCap();i++) spawnFungus();
    for(let i=0;i<3;i++) spawnCreature();
  }

  function step(){
    frame++;
    for(const b of branches) updateBranch(b);
    branches = branches.filter(b => b.state !== 'gone');

    for(const h of hyphae) if(h.alive) updateHypha(h);
    hyphae = hyphae.filter(h => h.alive);

    if(chance(0.006)) spawnFungus();
    if(chance(0.003)) spawnRoot(rand(W*0.04,W*0.96));
    if(chance(0.003)) spawnCreature();

    fctx.clearRect(0,0,W,H);
    for(const c of creatures){
      if(c.type==='worm') updateWorm(c); else updateBug(c);
    }

    pulses = pulses.filter(p => frame - p.born < 40);
    for(const p of pulses){
      const t = (frame - p.born)/40;
      fctx.strokeStyle = `rgba(242,214,117,${0.5*(1-t)})`;
      fctx.lineWidth = 1.2;
      fctx.beginPath(); fctx.arc(p.x,p.y, 4 + t*16, 0, 6.28); fctx.stroke();
    }

    requestAnimationFrame(step);
  }

  window.addEventListener('resize', resize);
  resize();

  if(reduceMotion){
    for(let i=0;i<500;i++){
      for(const b of branches) if(b.state==='growing') updateBranch(b);
    }
    fctx.clearRect(0,0,W,H);
  } else {
    step();
  }

  setTimeout(()=>{ document.getElementById('overlay').style.opacity = 1; }, 400);
})();
</script>
</body>
</html>
